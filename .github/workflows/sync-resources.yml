name: 资源采集托管

on:
  workflow_dispatch:
    inputs:
      targets:
        description: |
          要采集的接口，一行一个 "名称|链接"。留空则使用仓库内置的两个默认接口。
          例：
            tv菠菜|https://0.12yue.de5.net/5/tv.json
            菠菜园|https://0.12yue.de5.net/5/api.json
        required: false
        default: ""
  schedule:
    - cron: "0 18 * * *"   # 每天北京时间凌晨2点（UTC 18:00）自动跑一次；不需要可删掉
  push:
    branches: [main, master]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行采集
        env:
          TZ: Asia/Shanghai
        run: |
          python scripts/download.py \
            ${{ github.event.inputs.targets && format('--targets "{0}"', github.event.inputs.targets) || '' }}

      - name: 提交并推送
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(sync): 更新资源 [skip ci]"
          file_pattern: "resources/* batch_report.md"
          commit_author: "sync-bot <actions@github.com>"
