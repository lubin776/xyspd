name: 资源采集托管

on:
  workflow_dispatch:
    inputs:
      targets:
        description: |
          可选。每行一个「名称|接口链接」，留空则使用脚本内置默认接口。
          例：
            5_0|https://0.12yue.de5.net/5/0
            5_1|https://0.12yue.de5.net/5/1
        required: false
        type: string
  schedule:
    - cron: "0 18 * * *"   # 每天 UTC 18:00（北京时间 02:00）跑一次，按需改/关

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300    # 单次 run 上限（GitHub-hosted 硬顶 360）
    permissions:
      contents: write       # 需要写权限才能 push
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 采集并本地化
        run: |
          mkdir -p resources
          # 把输入框按换行拆成 --targets 参数（兼容 Windows 换行符）
          TARGETS=$(printf '%s\n' "${{ github.event.inputs.targets || '' }}" \
                      | tr -d '\r' | grep -v '^[[:space:]]*$' | sed 's/^/ /')
          python scripts/rel2abs_localize.py --seeds seeds --out resources $TARGETS

      - name: 提交托管
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources/ seeds/
          git diff --cached --quiet || git commit -m "chore(sync): 采集资源 [skip ci]"
          git push

      - name: 上传产物（单次 run 留存，30天）
        uses: actions/upload-artifact@v4
        with:
          name: resources
          path: resources/
          retention-days: 30
