name: 资源采集托管

on:
  workflow_dispatch:
    inputs:
      targets:
        description: |
          可选。每行一个「名称|接口链接」，留空则使用脚本内置默认接口(5/0~5/3)。
          例：
            5_0|https://0.12yue.de5.net/5/0
            5_1|https://0.12yue.de5.net/5/1
        required: false
        type: string
  push:
    paths:
      - 'seeds/**'   # seeds 输入档变更时自动跑一次

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write   # 需要写权限才能 push
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 采集并本地化
        id: crawl
        run: |
          set -u   # 遇未定义变量报错（不用 set -e，自行处理退出码）
          mkdir -p resources
          # 把输入框按换行拆成 --target 参数（兼容 Windows CRLF）
          TARGETS=$(printf '%s\n' "${{ github.event.inputs.targets || '' }}" \
                      | tr -d '\r' | grep -v '^[[:space:]]*$')
          if [ -n "$TARGETS" ]; then
            echo "$TARGETS" | while IFS= read -r line; do
              python scripts/rel2abs_localize.py \
                --seeds seeds --out resources --target "$line" \
                || echo "::warning::接口失败: $line"
            done
          else
            python scripts/rel2abs_localize.py --seeds seeds --out resources \
              || echo "::warning::全部接口失败(可能被 WAF 403), 见上方日志"
          fi
          # 输出是否有产物，供下一步判断要不要 commit
          echo "has_resources=$(ls -A resources/ 2>/dev/null | head -c1 | wc -l)" >> $GITHUB_OUTPUT

      - name: 提交托管
        if: steps.crawl.outputs.has_resources == '1'
        run: bash .github/workflows/commit_step.sh

      - name: 上传产物（单次 run 留存, 30天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resources
          path: resources/
          retention-days: 30
